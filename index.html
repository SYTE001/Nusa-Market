<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>NusaMarket — Handcrafted in Indonesia, Shipped Worldwide</title>
    <meta
      name="description"
      content="Hand-stamped batik from Pekalongan. Heavyweight cotton from Bandung. A curated storefront for Indonesia's independent ateliers."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0c0a09" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NusaMarket" />
    <meta property="og:title" content="NusaMarket — Handcrafted in Indonesia, Shipped Worldwide" />
    <meta
      property="og:description"
      content="A curated storefront for Indonesia's independent ateliers: hand-stamped batik, heavyweight cut-and-sew, and considered everyday pieces."
    />
    <meta property="og:image" content="https://nusa-market.vercel.app/images/og/nusamarket-og-editorial.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NusaMarket — Handcrafted in Indonesia, Shipped Worldwide" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NusaMarket — Handcrafted in Indonesia, Shipped Worldwide" />
    <meta
      name="twitter:description"
      content="A curated storefront for Indonesia's independent ateliers: hand-stamped batik, heavyweight cut-and-sew, and considered everyday pieces."
    />
    <meta name="twitter:image" content="https://nusa-market.vercel.app/images/og/nusamarket-og-editorial.webp" />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NusaMarket",
        "url": "https://nusa-market.vercel.app/",
        "logo": "https://nusa-market.vercel.app/favicon.svg",
        "description": "Curated storefront for Indonesia's independent artisans and heritage ateliers."
      }
    </script>

    <!-- Fonts are self-hosted from /fonts (see @font-face in index.css):
         no external CSS in the critical path, no third-party DNS, no render
         chain through two font CDNs. On a slow phone that is two fewer
         round-trips before the first paint of the LCP text. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
